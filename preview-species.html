<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Malaysia species preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1410;
        color: #e8ffb0;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: grid;
        grid-template-rows: auto auto 1fr;
        height: 100%;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid rgba(196, 255, 0, 0.25);
        font-size: 13px;
        line-height: 1.4;
      }
      header strong {
        color: #c4ff00;
      }
      #labels {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        padding: 10px 10px 0;
        font-size: 11px;
        text-align: center;
      }
      #labels span {
        opacity: 0.95;
      }
      #labels .swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        margin: 0 auto 4px;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      #labels em {
        display: block;
        color: #c4ff00;
        font-style: normal;
        font-weight: 700;
        margin-top: 2px;
        font-size: 12px;
      }
      #labels small {
        display: block;
        opacity: 0.65;
        font-size: 10px;
        margin-top: 2px;
      }
      #c {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        Distinct Malaysia silhouettes — hard-refresh if shapes look old.
        Wait ~8s for full growth. <strong>Shape + color</strong> should read apart.
      </header>
      <div id="labels">
        <span>
          <div class="swatch" style="background: #1f6b5a"></div>
          spire<em>Rhu</em><small>Casuarina equisetifolia</small>
        </span>
        <span>
          <div class="swatch" style="background: #3d9e4a"></div>
          fan<em>Angsana</em><small>Pterocarpus indicus</small>
        </span>
        <span>
          <div class="swatch" style="background: #5fd65a"></div>
          canopy<em>Kelat jambu</em><small>Syzygium grande</small>
        </span>
        <span>
          <div class="swatch" style="background: #145c38"></div>
          willow<em>Penaga lilin</em><small>Mesua ferrea</small>
        </span>
        <span>
          <div class="swatch" style="background: #6b8f3a"></div>
          under<em>Teh-tehan</em><small>Acalypha siamensis</small>
        </span>
      </div>
      <canvas id="c"></canvas>
    </div>
    <script type="module" src="/src/preview-species.js"></script>
  </body>
</html>
